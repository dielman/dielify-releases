[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ymp"
version = "0.1.0"
description = "Self-hosted YouTube Music player: local cache, offline playback, LAN/Tailscale server"
requires-python = ">=3.12"
# Versions pinned to known-good releases. YouTube changes often: bump yt-dlp and
# ytmusicapi together, run `ymp doctor` and the tests, then commit the new pins.
dependencies = [
    "ytmusicapi==1.12.3",
    "yt-dlp[default]==2026.10.26",
    "mutagen==1.48.1",
    "Pillow>=11,<13",
    "platformdirs>=4,<5",
    "requests>=2.32,<3",
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28,<1"]

[project.scripts]
ymp = "ymp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
